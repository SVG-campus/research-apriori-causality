version: 1
pillar: research-apriori-causality
title: "Apriori causality & LLM structures"
streaming_preferred: true

huggingface:
  - repo_id: nyu-mml/glue
    config: cola
    split: train[:2%]
    streaming: true
    note: Tiny GLUE stream for CI / dataloader sanity only — **not** causal identification evidence (text classification proxy).
  - repo_id: stanfordnlp/snli
    split: train[:1%]
    streaming: true
    note: NLI-style paired text for multi-input pipeline smoke — **not** a causal ID benchmark or Pearl-style claim surface.
  - repo_id: syrgkanislab/CausalReasoningBenchmark
    config: causal_queries
    split: train
    streaming: true
    note: Charter-shaped **HF stream** for `CHARTER_CAUSAL_BENCHMARK_SMOKE` + pytest; automated benchmark slice — not a full identification study or substitute for domain-native causal graphs.

kaggle: []


search_keywords: []

reference_streams:
  - name: Tubingen cause-effect pairs (reference)
    url: https://webdav.tuebingen.mpg.de/cause-effect/
    note: Classic pairwise causal benchmarks (off-Hub reference; not wired into CI stream charter). Align future native pins with `METHODS.md` / charter before treating as domain truth.

