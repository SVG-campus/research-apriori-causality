version: 1
pillar: research-apriori-causality
title: "Apriori causality & LLM structures"
streaming_preferred: true

huggingface:
  - repo_id: nyu-mml/glue
    config: cola
    split: train[:2%]
    streaming: true
    note: Tiny GLUE stream for CI / dataloader sanity — replace with domain datasets as charters land.
  - repo_id: stanfordnlp/snli
    split: train[:1%]
    streaming: true
    note: NLI-style paired text for multi-input pipeline smoke (not a causal ID benchmark).
  - repo_id: syrgkanislab/CausalReasoningBenchmark
    config: causal_queries
    split: train
    streaming: true
    note: Automated Causal Reasoning Benchmark (arXiv:2602.20571); small streaming slice for charter / CI — not a full identification study.

kaggle: []


search_keywords: []

reference_streams:
  - name: Tubingen cause-effect pairs (reference)
    url: https://webdav.tuebingen.mpg.de/cause-effect/
    note: Classic pairwise causal benchmarks; verify license before mirroring.

